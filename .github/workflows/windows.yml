name: Build Portable Windows libtorrent

on:
  push:
    branches:
      - RC_1_2 # Adjust branches as needed
      - RC_2_0
      - master
  pull_request:
    branches:
      - RC_1_2
      - RC_2_0
      - master
  workflow_dispatch: # Allows manual triggering

jobs:
  build-windows-x64-static:
    name: Build Windows x64 Static Release
    runs-on: windows-latest

    steps:
      - name: Checkout libtorrent repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # Important for libtorrent dependencies

      - name: Setup vcpkg
        uses: microsoft/vcpkg-action@v1 # Or use manual setup if preferred
        id: vcpkg # Give the step an id to reference its outputs
        with:
          # Define packages and triplet
          vcpkg-packages: boost-build boost openssl zlib # boost-build provides b2
          vcpkg-triplet: x64-windows-static # Static libraries + static CRT
          # vcpkg-commit-id: '<specific vcpkg commit hash>' # Optional: Pin vcpkg version

      - name: Cache vcpkg Archives
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.vcpkg-root }}/archives
          key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles(steps.vcpkg.outputs.vcpkg-root.'/vcpkg-lock.json') }} # Adjust key as needed
          restore-keys: |
            ${{ runner.os }}-vcpkg-archives-

      - name: Install dependencies using vcpkg
        shell: pwsh # Use PowerShell
        run: |
          cd "${{ steps.vcpkg.outputs.vcpkg-root }}"
          echo "Installing packages: ${{ steps.vcpkg.outputs.vcpkg-packages-list }} for triplet ${{ steps.vcpkg.outputs.vcpkg-triplet }}"
          # The vcpkg-action should have already run install, but we run integrate
          .\vcpkg integrate install
          echo "Listing installed packages..."
          .\vcpkg list # Verify installation

          # Add vcpkg installed tools (like b2) to PATH for this job
          $VCPKG_TOOLS_PATH = "${{ steps.vcpkg.outputs.vcpkg-root }}\installed\${{ steps.vcpkg.outputs.vcpkg-triplet }}\tools\boost-build"
          echo "Adding $VCPKG_TOOLS_PATH to PATH"
          echo "$VCPKG_TOOLS_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify b2 is available
        shell: pwsh
        run: |
          echo "Searching for b2..."
          Get-Command b2 -ErrorAction SilentlyContinue
          if ($?) {
            echo "b2 found in PATH:"
            (Get-Command b2).Path
            b2 --version
          } else {
            echo "ERROR: b2 not found in PATH!"
            exit 1
          }

      - name: Build libtorrent with b2
        shell: pwsh
        run: |
          echo "Starting libtorrent build..."
          # Build static library, release variant, static runtime, x64, with OpenSSL
          # -j flag lets b2 use multiple cores, detected automatically usually
          # --prefix specifies install location
          # toolset=msvc should be auto-detected on windows-latest
          b2 address-model=64 variant=release link=static runtime-link=static encryption=openssl --prefix=./_stage install
          echo "Build finished."

      - name: List Build Output
        shell: pwsh
        run: |
          echo "Contents of installation directory (_stage):"
          Get-ChildItem -Recurse -Path ./_stage

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libtorrent-windows-x64-static-${{ github.sha }} # Include SHA for uniqueness
          path: ./_stage # Upload the install directory (contains include/ and lib/)
          if-no-files-found: error # Fail if build didn't produce output
